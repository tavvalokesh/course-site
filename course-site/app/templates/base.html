<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Courses" }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">My Courses</a>
  <form action="/search" method="get" class="search" autocomplete="off">
    <input type="search" id="q" name="q" value="{{ query or '' }}"
           placeholder="Search courses, e.g. machine learning">
    <div id="suggest" class="suggest"></div>
  </form>
  <a class="upload-link" href="/upload">Upload</a>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
